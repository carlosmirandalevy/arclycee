<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración de viewport para dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Desactivar el comportamiento táctil predeterminado del navegador -->
    <meta name="touch-action" content="none">
    <!-- Descripción del juego -->
    <meta name="description" content="ArcLycée - Un juego RPG 2D de aventura arqueológica ambientado en la República Dominicana, creado por estudiantes del Liceo Francés de Santo Domingo.">
    <meta name="author" content="Liceo Francés de Santo Domingo">
    <!-- Tema de color para la barra del navegador en móviles -->
    <meta name="theme-color" content="#1a1a2e">
    <!-- Compatibilidad con aplicaciones web en móvil -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>ArcLycée - Aventura Arqueológica Dominicana</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="resources/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="resources/apple-touch-icon.png">

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ArcLycée - Aventura Arqueológica Dominicana">
    <meta property="og:description" content="Un juego RPG 2D de aventura arqueológica ambientado en la República Dominicana, creado por estudiantes del Liceo Francés de Santo Domingo.">
    <meta property="og:image" content="resources/og-share.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ArcLycée - Aventura Arqueológica Dominicana">
    <meta name="twitter:description" content="RPG 2D educativo sobre el patrimonio arqueológico dominicano.">
    <meta name="twitter:image" content="resources/og-share.png">

    <!-- Estilos principales -->
    <link rel="stylesheet" href="estilos/principal.css">

    <!-- LeafletJS - Biblioteca de mapas interactivos -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Kaplay.js - Motor para tilemap e interacciones táctiles -->
    <script src="https://unpkg.com/kaplay@3001/dist/kaplay.js"></script>
</head>
<body>
    <!-- Pantalla de carga - se muestra mientras se inicializan los recursos -->
    <div id="pantalla-carga">
        <div class="carga-contenido">
            <h1 class="carga-titulo">ArcLycée</h1>
            <p class="carga-subtitulo">Aventura Arqueológica Dominicana — v0.23.0</p>
            <div class="carga-barra-contenedor">
                <div class="carga-barra" id="barra-progreso"></div>
            </div>
            <p class="carga-texto" id="texto-carga">Cargando recursos...</p>
        </div>
    </div>

    <!-- Lienzo principal del juego -->
    <canvas id="juego-canvas"></canvas>

    <!-- Contenedor del mapa LeafletJS (oculto por defecto) -->
    <div id="mapa-contenedor"></div>

    <!-- Los controles virtuales táctiles se crean dinámicamente desde
         js/motor/entrada.js para que el sistema de entrada los gestione
         directamente. Solo aparecen en dispositivos táctiles. -->

    <!-- Módulo principal del juego - punto de entrada ES module -->
    <script type="module" src="js/motor/juego.js"></script>

    <!-- ARC Feedback Modal (solo visible con conexión a Internet) -->
    <style>
      #arc-feedback-btn { bottom: 20px; }
      @media (max-width: 768px), (pointer: coarse) {
        #arc-feedback-btn { bottom: auto !important; top: 12px !important; }
      }
    </style>
    <div id="arc-feedback-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:8px;">
      <div style="width:540px; max-width:95vw; display:flex; justify-content:flex-end;">
        <button id="arc-feedback-close" style="background:rgba(0,0,0,0.5); border:none; color:#fff; font-size:1.5rem; cursor:pointer; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;">&times;</button>
      </div>
      <iframe id="arc-feedback-iframe" src="" style="width:540px; max-width:95vw; height:80vh; border:none; border-radius:12px;"></iframe>
    </div>
    <button id="arc-feedback-btn" style="display:none; position:fixed; right:20px; z-index:9998; background:#C8962A; color:#0E0C0A; border:2px solid #E8B84A; border-radius:50%; width:48px; height:48px; cursor:pointer; box-shadow:3px 3px 0 rgba(0,0,0,0.5); padding:0; line-height:0;" title="Feedback"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></button>
    <script type="module">
    import idiomas from './js/idiomas/idiomas.js';
    (function() {
      var BASE_URL = 'https://arclycee-aux.web.app/form.html';
      var btn = document.getElementById('arc-feedback-btn');
      var overlay = document.getElementById('arc-feedback-overlay');
      var iframe = document.getElementById('arc-feedback-iframe');

      function checkOnline() {
        btn.style.display = navigator.onLine ? 'block' : 'none';
        if (!navigator.onLine) overlay.style.display = 'none';
      }
      checkOnline();
      window.addEventListener('online', checkOnline);
      window.addEventListener('offline', checkOnline);

      btn.addEventListener('click', function() {
        var lang = idiomas.idiomaActual || 'es';
        iframe.src = BASE_URL + '?lang=' + lang;
        overlay.style.display = 'flex';
      });

      function closeFeedback() {
        overlay.style.display = 'none';
        iframe.src = '';
      }

      document.getElementById('arc-feedback-close').addEventListener('click', closeFeedback);

      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeFeedback();
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && overlay.style.display === 'flex') closeFeedback();
      });

      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'arc-feedback-sent') {
          setTimeout(function() { overlay.style.display = 'none'; iframe.src = ''; }, 2000);
        }
      });
    })();
    </script>
</body>
</html>
