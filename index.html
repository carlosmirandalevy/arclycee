<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración de viewport para dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Desactivar el comportamiento táctil predeterminado del navegador -->
    <meta name="touch-action" content="none">
    <!-- Descripción del juego -->
    <meta name="description" content="ArcLycée - Un juego RPG 2D de aventura arqueológica ambientado en la República Dominicana, creado por estudiantes del Liceo Francés de Santo Domingo.">
    <meta name="author" content="Liceo Francés de Santo Domingo">
    <!-- Tema de color para la barra del navegador en móviles -->
    <meta name="theme-color" content="#1a1a2e">
    <!-- Compatibilidad con aplicaciones web en móvil -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>ArcLycée - Aventura Arqueológica Dominicana</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="resources/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="resources/apple-touch-icon.png">

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ArcLycée - Aventura Arqueológica Dominicana">
    <meta property="og:description" content="Un juego RPG 2D de aventura arqueológica ambientado en la República Dominicana, creado por estudiantes del Liceo Francés de Santo Domingo.">
    <meta property="og:image" content="resources/og-share.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ArcLycée - Aventura Arqueológica Dominicana">
    <meta name="twitter:description" content="RPG 2D educativo sobre el patrimonio arqueológico dominicano.">
    <meta name="twitter:image" content="resources/og-share.png">

    <!-- Estilos principales -->
    <link rel="stylesheet" href="estilos/principal.css">

    <!-- LeafletJS - Biblioteca de mapas interactivos -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Kaplay.js - Motor para tilemap e interacciones táctiles -->
    <script src="https://unpkg.com/kaplay@3001/dist/kaplay.js"></script>
</head>
<body>
    <!-- Pantalla de carga - se muestra mientras se inicializan los recursos -->
    <div id="pantalla-carga">
        <div class="carga-contenido">
            <h1 class="carga-titulo">ArcLycée</h1>
            <p class="carga-subtitulo">Aventura Arqueológica Dominicana</p>
            <div class="carga-barra-contenedor">
                <div class="carga-barra" id="barra-progreso"></div>
            </div>
            <p class="carga-texto" id="texto-carga">Cargando recursos...</p>
        </div>
    </div>

    <!-- Lienzo principal del juego -->
    <canvas id="juego-canvas"></canvas>

    <!-- Contenedor del mapa LeafletJS (oculto por defecto) -->
    <div id="mapa-contenedor"></div>

    <!-- Los controles virtuales táctiles se crean dinámicamente desde
         js/motor/entrada.js para que el sistema de entrada los gestione
         directamente. Solo aparecen en dispositivos táctiles. -->

    <!-- Módulo principal del juego - punto de entrada ES module -->
    <script type="module" src="js/motor/juego.js"></script>
</body>
</html>
